name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Build
        run: go build ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  backend-integration:
    name: Backend MySQL integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: xpense_trackr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_MYSQL_DSN: root:root_password@tcp(127.0.0.1:3306)/xpense_trackr_test?charset=utf8mb4&parseTime=True&loc=Local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: go test ./internal/integration -v -count=1

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/xpense-trackr-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: frontend/xpense-trackr-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test:ci
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/xpense-trackr-frontend/coverage/lcov.info
          if-no-files-found: ignore

  local-compose-smoke:
    name: Local Compose startup and persistence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the local app
        run: docker compose up --build -d

      - name: Verify startup, ledger API, and persistent data
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose logs --no-color
            exit 1
          fi

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" = "200"
          curl --silent --fail -X POST http://127.0.0.1:8080/api/v1/accounts \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI checking","type":"checking","currency":"USD","opening_balance_minor":10000}'
          curl --silent --fail -X POST http://127.0.0.1:8080/api/v1/transactions \
            -H 'Content-Type: application/json' \
            -d '{"account_id":1,"type":"expense","amount_minor":1234,"currency":"USD","date":"2026-11-08"}'
          curl --silent --fail http://127.0.0.1:8080/api/v1/accounts | grep -q '"balance_minor":8766'
          docker compose restart app
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8080/api/v1/accounts | grep -q '"balance_minor":8766'

          docker compose exec -T app /app/xpense-trackr backup --output /data/smoke-backup.zip
          curl --silent --fail -X POST http://127.0.0.1:8080/api/v1/transactions \
            -H 'Content-Type: application/json' \
            -d '{"account_id":1,"type":"expense","amount_minor":100,"currency":"USD","date":"2026-11-08"}'
          curl --silent --fail http://127.0.0.1:8080/api/v1/accounts | grep -q '"balance_minor":8666'
          docker compose stop app
          docker compose run --rm --no-deps app restore --input /data/smoke-backup.zip
          docker compose up -d app
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8080/api/v1/accounts | grep -q '"balance_minor":8766'

      - name: Stop app and remove test data
        if: always()
        run: docker compose down --volumes
