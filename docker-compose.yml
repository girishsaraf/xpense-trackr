services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_ADDR: ":8080"
      DB_DRIVER: sqlite
      DB_PATH: /data/xpense-trackr.db
      APP_DATA_DIR: /data
      WEB_DIR: /app/web
    volumes:
      - xpense-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  xpense-data:
